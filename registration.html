<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body{
            background:#f4f4f4;
            font-family:Arial,sans-serif;
            margin: 0;
        }

        /* Navigation Styling */
        nav {
            background: #003366;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }

        .container{
            width:450px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            box-sizing: border-box;
        }

        h2{
            text-align:center;
            color:#003366;
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            box-sizing: border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#003366;
            color:white;
            border:none;
            cursor:pointer;
            font-size: 16px;
        }

        button:hover{
            background:#0066cc;
        }

        /* POPUP MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 90%;
            transform: scale(0.7);
            transition: transform 0.3s ease;
        }

        /* Class to show the modal via JS */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h3 {
            color: #28a745;
            margin-top: 0;
        }

        .modal-close-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-close-btn:hover {
            background: #218838;
        }

    </style>

    <script>
        function validateForm(event){
            // Prevent form from auto-submitting immediately to showcase the popup
            event.preventDefault(); 

            let name = document.getElementById("fullname").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let gender = document.getElementById("gender").value;
            let password = document.getElementById("password").value;

            if(name==""){
                alert("Enter your name");
                return false;
            }

            if(email.indexOf("@")==-1 || email.indexOf(".")==-1){
                alert("Invalid Email");
                return false;
            }

            if(phone.length<10){
                alert("Invalid Phone Number");
                return false;
            }

            if(gender==""){
                alert("Select Gender");
                return false;
            }

            if(password.length<6){
                alert("Password must be at least 6 characters");
                return false;
            }

            // If everything passes, show the success popup
            showPopup();
            return true;
        }

        function showPopup() {
            document.getElementById("successModal").classList.add("active");
        }

        function closePopup() {
            document.getElementById("successModal").classList.remove("active");
            // Submit the form programmatically after closing the popup, or redirect
            document.getElementById("regForm").submit(); 
        }
    </script>
</head>
<body>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
    <a href="gallery.html">Gallery</a>
    <a href="registration.html">Registration</a>
</nav>

<div class="container">

<h2>User Registration</h2>

<form id="regForm" action="register.php" method="POST" onsubmit="validateForm(event)">

<label>Full Name</label>
<input type="text" name="fullname" id="fullname">

<label>Email</label>
<input type="text" name="email" id="email">

<label>Phone Number</label>
<input type="text" name="phone" id="phone">

<label>Gender</label>
<select name="gender" id="gender">
    <option value="">Select Gender</option>
    <option>Male</option>
    <option>Female</option>
</select>

<label>Password</label>
<input type="password" name="password" id="password">

<button type="submit">Register</button>

</form>

</div>

<div class="modal-overlay" id="successModal">
    <div class="modal-box">
        <h3>Registration Successful!</h3>
        <p>Thank you for signing up. Your account has been created.</p>
        <button class="modal-close-btn" onclick="closePopup()">Proceed</button>
    </div>
</div>

</body>
</html>
