<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body{
            background:#f4f4f4;
            font-family:Arial,sans-serif;
            margin: 0;
        }

        /* Navigation Styling */
        nav {
            background: #003366;
            padding: 15px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }

        .container{
            width:450px;
            margin:50px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            box-sizing: border-box;
        }

        h2{
            text-align:center;
            color:#003366;
        }

        input, select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            box-sizing: border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#003366;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0066cc;
        }

        /* --- WELCOME POPUP STYLES --- */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6); /* Dim background */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 9999; /* Keeps it above everything */
        }

        /* Active class to make popup visible */
        .welcome-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .welcome-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 90%;
            transform: translateY(-20px);
            transition: transform 0.4s ease;
        }

        .welcome-overlay.show .welcome-box {
            transform: translateY(0);
        }

        .welcome-box h3 {
            color: #003366;
            margin-top: 0;
            font-size: 24px;
        }

        .welcome-box p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
        }

        .close-welcome-btn {
            background: #003366;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .close-welcome-btn:hover {
            background: #0066cc;
        }

    </style>

    <script>
        // 1. POPUP ON LOAD: Runs as soon as the page elements are ready
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("welcomePopup").classList.add("show");
        });

        function closeWelcomePopup() {
            document.getElementById("welcomePopup").classList.remove("show");
        }

        // 2. FORM VALIDATION (Your existing code)
        function validateForm(){
            let name = document.getElementById("fullname").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let gender = document.getElementById("gender").value;
            let password = document.getElementById("password").value;

            if(name==""){
                alert("Enter your name");
                return false;
            }
            if(email.indexOf("@")==-1 || email.indexOf(".")==-1){
                alert("Invalid Email");
                return false;
            }
            if(phone.length<10){
                alert("Invalid Phone Number");
                return false;
            }
            if(gender==""){
                alert("Select Gender");
                return false;
            }
            if(password.length<6){
                alert("Password must be at least 6 characters");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>

<div class="welcome-overlay" id="welcomePopup">
    <div class="welcome-box">
        <h3>Welcome to Our Platform!</h3>
        <p>Please register an account to unlock full access to our premium services, gallery, and community features.</p>
        <button class="close-welcome-btn" onclick="closeWelcomePopup()">Get Started</button>
    </div>
</div>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
    <a href="gallery.html">Gallery</a>
    <a href="registration.html">Registration</a>
</nav>

<div class="container">
    <h2>User Registration</h2>
    <form action="register.php" method="POST" onsubmit="return validateForm()">
        <label>Full Name</label>
        <input type="text" name="fullname" id="fullname">

        <label>Email</label>
        <input type="text" name="email" id="email">

        <label>Phone Number</label>
        <input type="text" name="phone" id="phone">

        <label>Gender</label>
        <select name="gender" id="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <label>Password</label>
        <input type="password" name="password" id="password">

        <button type="submit">Register</button>
    </form>
</div>

</body>
</html>
